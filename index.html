<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legenda — erkaklar kiyimi</title>
<meta name="description" content="Legenda: Andijon, Shahrixon va Asakadagi erkaklar kiyim do'konlari. Klassik va zamonaviy obrazlar.">
<!-- brauzer paneli (telefonda tepadagi tasma) kino rangida — krem bo'lsa skrollda qora kino ustida pirpiraydi -->
<meta name="theme-color" content="#0d0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Kaushan+Script&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- sayt Andijon kinosining birinchi kadri bilan ochiladi — video kelguncha shu rasm -->
<link rel="preload" as="image" href="assets/video/andijon_boshi.jpg" media="(min-aspect-ratio: 4/5)">
<link rel="preload" as="image" href="assets/video/andijon_boshi_m.jpg" media="(max-aspect-ratio: 4/5)">
</head>
<body>

<header class="nav" id="nav">
  <a class="brand" href="#journey" aria-label="Legenda — bosh sahifa">
    <svg viewBox="0 0 40 30" aria-hidden="true"><path d="M20 4a3.2 3.2 0 1 1 3.2 3.2c-1.2 0-3.2.8-3.2 2.6v1.6L37 24H3l17-12.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>LEGENDA</span>
  </a>
  <nav>
    <a href="#aloqa" id="navBranches">Filiallar</a>
    <a href="#journey" id="navTry" hidden>Kiyib ko'rish</a>
    <a href="#katalog" id="navCatalog" hidden>Katalog</a>
    <a href="#aloqa">Aloqa</a>
  </nav>
</header>

<!-- 1. DO'KONGA KIRISH: sayt shu bilan ochiladi (Andijon — do'kon tepasidagi dron kadridan). Skroll videoni (yoki
     kadrlarni) suradi; eshikdan keyin — kiyimlar (model skroll bilan aylanadi) -->
<section class="journey" id="journey" aria-label="Do'konga kirish">
  <div class="stage" id="stage">
    <div class="layers" id="layers"></div>
    <div class="ov ov-day" id="ovDay"></div>
    <div class="ov ov-night" id="ovNight"></div>
    <div class="ov ov-glow" id="ovGlow"></div>
    <div class="ov ov-warm" id="ovWarm"></div>
    <div class="vignette"></div>
    <div class="veil" id="veil"></div>
    <div class="cap" id="cap"></div>
    <div class="hint" id="hint"><span>Pastga suring</span><i></i></div>
    <div class="steps" id="steps">
      <div class="track"><b id="trackFill"></b></div>
      <ol><li>Shahar</li><li>Fasad</li><li>Kechqurun</li><li>Ichkari</li><li hidden>Kiyimlar</li></ol>
    </div>
    <aside class="look-card" id="lookCard" aria-live="polite">
      <div class="try-top"><span class="id" id="lookId"></span><span class="try-count" id="lookCount"></span></div>
      <div class="look-info" id="lookInfo"></div>
      <div class="try-nav">
        <button type="button" class="arrow" id="lookPrev" aria-label="Oldingi kiyim"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="thumbs" id="lookThumbs"></div>
        <button type="button" class="arrow" id="lookNext" aria-label="Keyingi kiyim"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </aside>
    <nav class="switch" id="switch" aria-label="Filiallar"></nav>
  </div>
</section>

<!-- 2. TANLANGAN DO'KON KATALOGI -->
<section class="catalog" id="katalog" hidden>
  <div class="cat-head">
    <div>
      <span class="kicker" id="catKicker"></span>
      <h2 id="catTitle"></h2>
    </div>
    <div class="cat-meta" id="catMeta"></div>
  </div>
  <div class="chips" id="chips" role="tablist"></div>
  <div class="grid" id="grid"></div>
</section>

<!-- 3. ALOQA: uchala filial -->
<section class="contacts" id="aloqa">
  <span class="kicker">ALOQA</span>
  <h2>Uchta filial — <em>bitta Legenda</em></h2>
  <div class="branches" id="branches"></div>
  <p class="delivery">O'zbekiston bo'ylab yetkazib berish bor.</p>
</section>

<footer class="foot">
  <span>© LEGENDA</span>
  <span>Klassik &amp; zamonaviy obrazlar</span>
</footer>

<script src="assets/data.js"></script>
<script src="app.js"></script>
</body>
</html>
